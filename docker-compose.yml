services:
  gcal-sync:
    build: .
    image: gcal-sogo-sync
    container_name: gcal-sogo-sync
    restart: unless-stopped
    environment:
      SYNC_INTERVAL: 900
      TZ: "Europe/Amsterdam"
      GCAL_CUTOFF_DATE: "2026-07-01"
      GCAL_CUTOFF_END_DATE: "2027-06-30"
    volumes:
      - ./people:/config/people:ro
      - gcal-data:/data

volumes:
  gcal-data:
